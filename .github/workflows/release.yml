name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

env:
  PROJECT_PATH: src/FiveMDiagnostics.App.Wpf/FiveMDiagnostics.App.Wpf.csproj
  PROJECT_NAME: FiveMDiagnostics
  RUNTIME_ID: win-x64
  WINDOWS_CODESIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_PFX_BASE64 }}
  WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute release metadata
        id: meta
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $tagName = "v$version"
          $assemblyVersion = "1.0.${{ github.run_number }}.0"
          $releaseName = "FiveMDiagnostics $version"
          $assetName = "FiveMDiagnostics-$version-win-x64.zip"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish app
        shell: pwsh
        run: |
          $publishDir = Join-Path $PWD "artifacts/publish/$env:RUNTIME_ID"

          if (Test-Path $publishDir)
          {
            Remove-Item $publishDir -Recurse -Force
          }

          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r $env:RUNTIME_ID `
            --self-contained true `
            -p:ContinuousIntegrationBuild=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false `
            -p:PublishReadyToRun=false `
            -p:Version=${{ steps.meta.outputs.version }} `
            -p:AssemblyVersion=${{ steps.meta.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.meta.outputs.assembly_version }} `
            -p:InformationalVersion="${{ steps.meta.outputs.version }}+${{ github.sha }}" `
            -o $publishDir

          # The updater matches the archive against the name of the running executable,
          # so a release that does not carry FiveMDiagnostics.exe cannot be installed.
          if (!(Test-Path (Join-Path $publishDir "FiveMDiagnostics.exe")))
          {
            throw "Expected published executable not found in $publishDir"
          }

      - name: Code sign executable (optional)
        if: ${{ env.WINDOWS_CODESIGN_CERT_PFX_BASE64 != '' && env.WINDOWS_CODESIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "fivemdiagnostics-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_PFX_BASE64))

          $exePath = Join-Path $PWD "artifacts/publish/$env:RUNTIME_ID/FiveMDiagnostics.exe"
          signtool sign `
            /fd SHA256 `
            /f $certPath `
            /p $env:WINDOWS_CODESIGN_CERT_PASSWORD `
            /tr "http://timestamp.digicert.com" `
            /td SHA256 `
            $exePath

      - name: Create release zip
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $PWD "artifacts/${{ steps.meta.outputs.asset_name }}"

          if (Test-Path $zipPath)
          {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "artifacts/publish/$env:RUNTIME_ID/*" -DestinationPath $zipPath

          # The in-app updater downloads this file alongside the zip and refuses to
          # install an archive whose hash does not match it.
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ steps.meta.outputs.asset_name }}" | Set-Content -Path "$zipPath.sha256" -NoNewline
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fivemdiagnostics-${{ steps.meta.outputs.version }}-win-x64
          path: |
            artifacts/${{ steps.meta.outputs.asset_name }}
            artifacts/${{ steps.meta.outputs.asset_name }}.sha256

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          Automated release from the main branch.

          Tag: ${{ steps.meta.outputs.tag_name }}
          Build: ${{ steps.meta.outputs.version }}
          Commit: ${{ github.sha }}
          Runtime: ${{ env.RUNTIME_ID }}
          SHA-256: ${{ steps.package.outputs.sha256 }}

          Download the asset below, extract it, and run FiveMDiagnostics.exe. Keep the
          same install path across updates: the app updates itself in place from there.

          Windows Defender SmartScreen may warn about a newly published or unsigned build.
          Verify that the archive came from this GitHub release and compare its SHA-256
          hash with the attached .sha256 file before choosing More info > Run anyway.
          "@ | Set-Content -Path artifacts/release-notes.md

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag_name }}
          commit: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          bodyFile: artifacts/release-notes.md
          artifacts: artifacts/${{ steps.meta.outputs.asset_name }},artifacts/${{ steps.meta.outputs.asset_name }}.sha256
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          makeLatest: true
